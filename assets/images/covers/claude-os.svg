<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="cyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 500) rotate(45) scale(500 350)">
      <stop offset="0" stop-color="#00D9FF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purple" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(200 120) rotate(0) scale(420 280)">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="memoryGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF00FF" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#cyan)"/>
  <rect width="1200" height="630" fill="url(#purple)"/>

  <!-- Memory/Brain Circuit visualization -->
  <g transform="translate(750, 200)">
    <!-- Central hub -->
    <circle cx="100" cy="100" r="50" fill="none" stroke="url(#memoryGrad)" stroke-width="3"/>
    <circle cx="100" cy="100" r="35" fill="none" stroke="url(#memoryGrad)" stroke-width="2" opacity="0.6"/>
    <circle cx="100" cy="100" r="6" fill="#00D9FF"/>

    <!-- Memory nodes -->
    <g opacity="0.8">
      <!-- Top right -->
      <circle cx="190" cy="50" r="18" fill="#00D9FF" fill-opacity="0.3" stroke="#00D9FF" stroke-width="2"/>
      <line x1="145" y1="70" x2="175" y2="55" stroke="#00D9FF" stroke-width="2" opacity="0.6"/>

      <!-- Right -->
      <circle cx="220" cy="100" r="18" fill="#8B5CF6" fill-opacity="0.3" stroke="#8B5CF6" stroke-width="2"/>
      <line x1="150" y1="100" x2="202" y2="100" stroke="#8B5CF6" stroke-width="2" opacity="0.6"/>

      <!-- Bottom right -->
      <circle cx="190" cy="150" r="18" fill="#FF00FF" fill-opacity="0.3" stroke="#FF00FF" stroke-width="2"/>
      <line x1="145" y1="130" x2="175" y2="145" stroke="#FF00FF" stroke-width="2" opacity="0.6"/>

      <!-- Top -->
      <circle cx="100" cy="20" r="15" fill="#00D9FF" fill-opacity="0.3" stroke="#00D9FF" stroke-width="2"/>
      <line x1="100" y1="50" x2="100" y2="35" stroke="#00D9FF" stroke-width="2" opacity="0.5"/>

      <!-- Bottom -->
      <circle cx="100" cy="180" r="15" fill="#8B5CF6" fill-opacity="0.3" stroke="#8B5CF6" stroke-width="2"/>
      <line x1="100" y1="150" x2="100" y2="165" stroke="#8B5CF6" stroke-width="2" opacity="0.5"/>

      <!-- Left -->
      <circle cx="20" cy="100" r="15" fill="#FF00FF" fill-opacity="0.3" stroke="#FF00FF" stroke-width="2"/>
      <line x1="50" y1="100" x2="35" y2="100" stroke="#FF00FF" stroke-width="2" opacity="0.5"/>
    </g>

    <!-- Pulse rings animation effect -->
    <circle cx="100" cy="100" r="60" fill="none" stroke="#00D9FF" stroke-width="1" opacity="0.3"/>
    <circle cx="100" cy="100" r="70" fill="none" stroke="#8B5CF6" stroke-width="1" opacity="0.2"/>
  </g>

  <!-- Claude Code icon reference -->
  <g transform="translate(850, 420)">
    <rect x="0" y="0" width="70" height="50" rx="6" fill="#8B5CF6" fill-opacity="0.2" stroke="#8B5CF6" stroke-width="2"/>
    <text x="35" y="32" font-family="monospace" font-size="20" fill="#00D9FF" text-anchor="middle" font-weight="700">C</text>
  </g>

  <!-- Main text -->
  <g font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#c9d1d9">
    <text x="80" y="270" font-size="56" font-weight="700">Why we built</text>
    <text x="80" y="330" font-size="56" font-weight="700">Claude OS</text>
    <text x="80" y="390" font-size="32" fill="#9ea7b3">AI with actual memory</text>
    <text x="80" y="440" font-size="24" fill="#6e7681">3 seconds to index 10,000 files</text>
  </g>
</svg>
