<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 315) scale(250 250)">
      <stop offset="0" stop-color="#f0c040" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#f0c040" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(900 315) scale(250 250)">
      <stop offset="0" stop-color="#4af0a0" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#4af0a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0c040" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4af0a0" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Grid lines -->
  <g opacity="0.05" stroke="#c9d1d9" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Flow line -->
  <line x1="200" y1="315" x2="1000" y2="315" stroke="url(#flow)" stroke-width="3"/>

  <!-- Node 1: MacBook -->
  <g transform="translate(300, 315)">
    <circle cx="0" cy="0" r="55" fill="none" stroke="#f0c040" stroke-width="2" opacity="0.4"/>
    <circle cx="0" cy="0" r="40" fill="#f0c040" fill-opacity="0.15" stroke="#f0c040" stroke-width="2"/>
    <!-- Laptop icon -->
    <rect x="-14" y="-12" width="28" height="18" rx="2" fill="none" stroke="#f0c040" stroke-width="2"/>
    <line x1="-18" y1="10" x2="18" y2="10" stroke="#f0c040" stroke-width="2"/>
    <text x="0" y="85" font-family="Inter, -apple-system, sans-serif" font-size="18" fill="#f0c040" text-anchor="middle" font-weight="600">2012 MacBook</text>
    <text x="0" y="108" font-family="Inter, -apple-system, sans-serif" font-size="14" fill="#6e7681" text-anchor="middle">macOS Ventura via OCLP</text>
    <text x="0" y="126" font-family="Inter, -apple-system, sans-serif" font-size="14" fill="#6e7681" text-anchor="middle">Headless server</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(420, 315)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#9ea7b3" stroke-width="2" opacity="0.4"/>
    <polygon points="60,-5 70,0 60,5" fill="#9ea7b3" opacity="0.4"/>
  </g>

  <!-- Node 2: Caddy + Claude -->
  <g transform="translate(600, 315)">
    <circle cx="0" cy="0" r="55" fill="none" stroke="#8B5CF6" stroke-width="2" opacity="0.4"/>
    <circle cx="0" cy="0" r="40" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-width="2"/>
    <!-- Terminal prompt -->
    <text x="0" y="4" font-family="monospace" font-size="18" fill="#8B5CF6" text-anchor="middle" font-weight="700">$_</text>
    <text x="0" y="85" font-family="Inter, -apple-system, sans-serif" font-size="18" fill="#8B5CF6" text-anchor="middle" font-weight="600">Claude + Caddy</text>
    <text x="0" y="108" font-family="Inter, -apple-system, sans-serif" font-size="14" fill="#6e7681" text-anchor="middle">Agent jobs + file server</text>
    <text x="0" y="126" font-family="Inter, -apple-system, sans-serif" font-size="14" fill="#6e7681" text-anchor="middle">Cron automation</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(720, 315)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#9ea7b3" stroke-width="2" opacity="0.4"/>
    <polygon points="60,-5 70,0 60,5" fill="#9ea7b3" opacity="0.4"/>
  </g>

  <!-- Node 3: Cloudflare -->
  <g transform="translate(900, 315)">
    <circle cx="0" cy="0" r="55" fill="none" stroke="#4af0a0" stroke-width="2" opacity="0.4"/>
    <circle cx="0" cy="0" r="40" fill="#4af0a0" fill-opacity="0.15" stroke="#4af0a0" stroke-width="2"/>
    <!-- Globe icon -->
    <circle cx="0" cy="0" r="12" fill="none" stroke="#4af0a0" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="6" ry="12" fill="none" stroke="#4af0a0" stroke-width="1.5" opacity="0.6"/>
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#4af0a0" stroke-width="1.5" opacity="0.6"/>
    <text x="0" y="85" font-family="Inter, -apple-system, sans-serif" font-size="18" fill="#4af0a0" text-anchor="middle" font-weight="600">Cloudflare Tunnel</text>
    <text x="0" y="108" font-family="Inter, -apple-system, sans-serif" font-size="14" fill="#6e7681" text-anchor="middle">share.yourdomain.com</text>
    <text x="0" y="126" font-family="Inter, -apple-system, sans-serif" font-size="14" fill="#6e7681" text-anchor="middle">Public URLs, $0</text>
  </g>

  <!-- Top text -->
  <text x="600" y="120" font-family="Inter, -apple-system, sans-serif" font-size="20" fill="#6e7681" text-anchor="middle" letter-spacing="3">SELF-HOSTED SERVER</text>

  <!-- Bottom text -->
  <text x="600" y="545" font-family="Inter, -apple-system, sans-serif" font-size="16" fill="#6e7681" text-anchor="middle">Old hardware. New tricks. Zero monthly cost.</text>
</svg>